<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingredientes de Pizza</title>
    <script defer src="script.js"></script>
</head>

<body>
    <h1>Elige los ingredientes para tu pizza</h1>

    <div id="divPrincipal">
      
        <input type="checkbox" id="queso" name="ingredientes" value="Queso extra">
        <label for="queso">Queso extra</label><br>

        <input type="checkbox" id="pepperoni" name="ingredientes" value="Pepperoni">
        <label for="pepperoni">Pepperoni</label><br>

        <input type="checkbox" id="aceitunas" name="ingredientes" value="Aceitunas">
        <label for="aceitunas">Aceitunas</label><br><br>

        <button id="boton">Confirmar pedido</button>
    </div>

  
    <p id="parrafo"></p>
</body>

</html>
